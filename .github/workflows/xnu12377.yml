name: Munch - XNU 12377 (iOS 26, non-PAC arm64)

# The iOS 26 kernel line for munch: Apple's xnu-12377.121.6 with the HakiOS port on top,
# built as plain arm64 for a board without pointer authentication.
#
# Why this and not xnu.yml: that one builds the project's own xnu-8796 series (iOS 16). iOS 26
# ships only arm64e user space, and xnu-12377 removed the non-Apple BCM2837 board, so nothing
# there can produce an arm64 kernel at 12377. The HakiOS patch puts the board back
# (pexpert/pexpert/arm64/BCM2837.h, SUPPORTED_ARM64_MACHINE_CONFIGS, MACHINE_FLAGS_ARM64_BCM2837)
# and carries its drivers; ARCH_CONFIG=ARM64 keeps the kernel on the plain arm64 ABI, which is
# what SM8250 can execute (it has no PAC; arm64e instructions are NOPs there).
#
# Untested on this branch: the first run exists to find out whether the patch applies to the tag
# and whether blacktop's build.sh accepts a tree it did not clone itself.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS build host (xnu-12377 ships with macOS 26.5; macos-26 has Xcode 26.5)
        type: choice
        options: [macos-26, macos-15-intel]
        default: macos-26

permissions:
  contents: read

concurrency:
  group: munch-ios26-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  HAKIOS_REPO: https://github.com/superboyyy/hakios-arm64e-dada
  HAKIOS_SHA: f1ae906fcc43ba8f763663257724ba938fb820ab
  XNU_TAG: xnu-12377.121.6
  # Apple's release map macos-265 lists xnu-12377.121.6, bootstrap_cmds-138 and dtrace-413; the build tools
  # of macOS 13.5 (bootstrap_cmds with a mig that lacks -mach_msg2) failed the first run
  MACOS_VERSION: '26.5'
  KERNEL_CONFIG: DEVELOPMENT
  # the board the HakiOS patch carries: GICv3, PSCI SMP, no pointer auth
  MACHINE_CONFIG: BCM2837
  ARCH_CONFIG: ARM64

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the build scripts and the HakiOS kernel patch
        shell: bash
        run: |
          set -euo pipefail
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          test "$(git -C dxb rev-parse HEAD)" = "$DXB_SHA"
          git init -q hakios
          git -C hakios fetch -q --depth 1 "$HAKIOS_REPO" "$HAKIOS_SHA"
          git -C hakios checkout -q FETCH_HEAD
          test "$(git -C hakios rev-parse HEAD)" = "$HAKIOS_SHA"
          wc -l hakios/kernel/xnu-12377.121.6-dada.patch

      - name: Prepare the iOS 26 kernel tree
        shell: bash
        run: |
          set -euo pipefail
          # build.sh clones xnu itself only when dxb/xnu is absent; a tree placed here is used as it is
          git clone -q --depth 1 --branch "$XNU_TAG" https://github.com/apple-oss-distributions/xnu.git dxb/xnu
          git -C dxb/xnu apply --whitespace=nowarn "$PWD/hakios/kernel/xnu-12377.121.6-dada.patch"
          test -f dxb/xnu/pexpert/pexpert/arm64/BCM2837.h
          grep -q BCM2837 dxb/xnu/makedefs/MakeInc.def
          git -C dxb/xnu rev-parse HEAD

      - name: Fix what the HakiOS patch leaves to its own build
        shell: bash
        run: |
          set -euo pipefail
          # redwood_goodix.c includes a FocalTech firmware blob the patch does not carry. Empty here: the
          # driver then has nothing to download (touch is not needed to boot).
          cat > dxb/xnu/bsd/dev/redwood_focaltech_fw.h <<'EOF'
          #ifndef REDWOOD_FOCALTECH_FW_H
          #define REDWOOD_FOCALTECH_FW_H
          #include <stdint.h>
          #define FOCALTECH_FW_LENGTH 0u
          static const uint8_t focaltech_fw[1] = { 0 };
          #endif
          EOF
          # HakiOS defines XNU_NO_TYPE_BUILTINS in its own host header (xnu_clang_compat.h: 1 without
          # __builtin_xnu_type_signature, else 0). Apple's clang has the builtins and that header is not in this
          # build, so OSData.h's static_assert sees an undeclared identifier. kalloc.h tests it with #if (0 if undefined).
          # blacktop's build.sh compiles the kernel for the macOS platform (SDKROOT=macosx, XNU_TARGET_OS_OSX).
          # The HakiOS configuration is an iOS one (CONFIG_JETSAM etc., xnu-build.sh uses SDKROOT=iphoneos), and the
          # macOS platform macros then disagree with it (vm_compressor.c, vm_compressor_backing_store.c).
          sed -i '' '/TARGET_CONFIGS=.*KERNEL_CONFIG/ s/SDKROOT=macosx/SDKROOT=iphoneos/' dxb/build.sh
          grep -n 'SDKROOT=iphoneos' dxb/build.sh
          sed -i '' 's/XNU_NO_TYPE_BUILTINS || //' dxb/xnu/libkern/libkern/c++/OSData.h
          ! grep -n 'XNU_NO_TYPE_BUILTINS ||' dxb/xnu/libkern/libkern/c++/OSData.h
          grep -n 'KALLOC_TYPE_IS_DATA_ONLY(T) || (acquisition == kValueNoCopy)' dxb/xnu/libkern/libkern/c++/OSData.h
          # The patch's PAC diagnostics outside HAS_STD_PAC (that macro is set only for __arm64e__) read the PAC key
          # registers: they do not assemble for plain arm64 and would take an undefined-instruction exception on a
          # CPU without PAC (SM8250 has none). Compile them for arm64e only.
          # ccache classes -MJ (clang's compilation database output) as an unsupported option and then does not
          # cache the compile at all (ccache argprocessing.cpp); XNU's C, C++ and assembler rules always pass it.
          sed -i '' 's/ -MJ \$(@:o=o\.json)//' dxb/xnu/makedefs/MakeInc.rule
          ! grep -n -e '-MJ' dxb/xnu/makedefs/MakeInc.rule
          # Without -MJ there are no .o.json files, and build_all always makes compile_commands.json from them
          # (MakeInc.kernel:102, unconditional): run 8 failed there ("sed: ...mac_pipe.o.json: No such file").
          sed -i '' '/^do_build_all:: do_build_compile_commands_json$/d' dxb/xnu/makedefs/MakeInc.kernel
          ! grep -n 'do_build_all:: do_build_compile_commands_json' dxb/xnu/makedefs/MakeInc.kernel
          python3 - <<'PY'
          import re
          from pathlib import Path

          def edit(path, fn):
              p = Path('dxb/xnu') / path
              s = p.read_text()
              n = fn(s)
              assert n != s, f'{path}: nothing changed'
              p.write_text(n)
              print('patched', path)

          # osfmk/arm/arm_init.c: hk_ib_probe() and its caller hk_ib_report()
          def arm_init(s):
              head = 'hk_ib_probe(struct hk_ibprobe *r)\n{\n'
              i = s.index(head) + len(head)
              j = s.index('\n}\n', i)
              zero = 'r->before = r->after = r->reg_before = r->reg_after = r->cpacr = r->ttbr = 0;'
              return s[:i] + '#if defined(__arm64e__)\n' + s[i:j] + '\n#else\n\t' + zero + '\n#endif' + s[j:]
          edit('osfmk/arm/arm_init.c', arm_init)

          # osfmk/arm64/sleh.c: the first user-mode faults are logged with two key registers
          def sleh(s):
              a = '\t\t\t__asm__ volatile ("mrs %0, APIAKeyLo_EL1" : "=r" (ia));\n'
              b = '\t\t\t__asm__ volatile ("mrs %0, APGAKeyLo_EL1" : "=r" (ga));\n'
              assert s.count(a + b) == 1
              return s.replace(a + b, '#if defined(__arm64e__)\n' + a + b + '#else\n\t\t\tia = ga = 0;\n#endif\n')
          edit('osfmk/arm64/sleh.c', sleh)

          # osfmk/arm64/start.s: checkpoint 9 diagnostic, from its comment to the local label after br x9
          def start(s):
              m = re.search(r'\t// hakios DIAGNOSTIC \(checkpoint 9\).*?\n1:\n', s, re.S)
              assert m and s.count('hakios DIAGNOSTIC (checkpoint 9)') == 1
              return s[:m.start()] + '#if defined(__arm64e__)\n' + m.group(0) + '#endif\n' + s[m.end():]
          edit('osfmk/arm64/start.s', start)

          # bsd/dev/redwood_ufs.c: ufs_write=1 accepts only a darwin at exactly these bounds. The patch has redwood's
          # (LBA 25374720, 5242875 blocks); munch's darwin is GPT entry 36, LBA 45102848..61880063 = 16777216 blocks
          # of 4096 (ref/munch/sda-gpt-after.bin). User decision 2026-11-05: munch's exact values, not a minimum.
          # The write floor moves too: iOS 26's three containers (OS 2390016 + SystemOS cryptex 1284608 + AppOS
          # cryptex 3584 blocks, nx_block_count of each decrypted image) end at block 3678208, past redwood's 2042368;
          # 4194304 (16 GiB) is the next power of two. The loader's BLOCK_WRITE_FIRST must equal it (ufs_page check).
          def ufs(s):
              a = '#define UFS_DARWIN_FIRST   25374720ULL'
              b = '#define UFS_DARWIN_BLOCKS  5242875ULL'
              w = '#define UFS_WRITE_FIRST    2042368ULL'
              assert s.count(a) == 1 and s.count(b) == 1 and s.count(w) == 1
              return (s.replace(a, '#define UFS_DARWIN_FIRST   45102848ULL').replace(b, '#define UFS_DARWIN_BLOCKS  16777216ULL')
                      .replace(w, '#define UFS_WRITE_FIRST    4194304ULL'))
          edit('bsd/dev/redwood_ufs.c', ufs)

          # osfmk/kern/exclaves.c: run 10's link stopped at _tb_transport_startup. The KDK's libTightbeam.a has only
          # x86_64 and arm64e.kernel slices ("fat file missing arch 'arm64'"), and munch has no exclaves to talk to.
          def exclaves(s):
              a = '#if __has_include(<Tightbeam/tightbeam.h>)\n\n#include <Tightbeam/tightbeam.h>'
              assert s.count(a) == 1
              return s.replace(a, '#if __has_include(<Tightbeam/tightbeam.h>) && defined(__arm64e__)\n\n#include <Tightbeam/tightbeam.h>')
          edit('osfmk/kern/exclaves.c', exclaves)

          # bsd/conf/files: run 10's link stopped at the twelve nw_wifi_* symbols hakios_dada_wifi.c/_wlan.c declare weak.
          # They are dada's ath12k port, an object linked in by dada's own build and not by this one; Mach-O ld does not
          # let a weak reference stay undefined in the kernel. munch has a QCA6390, not dada's chip: stubs, whose start
          # fails, so the driver says so and returns (hakios_dada_wifi.c wifi_thread, "the driver's start returns").
          def files(s):
              a = 'bsd/dev/hakios_dada_wlan.c\tstandard\n'
              assert s.count(a) == 1
              return s.replace(a, a + 'bsd/dev/munch_nw_stubs.c\tstandard\n')
          edit('bsd/conf/files', files)
          Path('dxb/xnu/bsd/dev/munch_nw_stubs.c').write_text('''\
          /* munch: dada's Wi-Fi library is not linked (see the CI workflow); its entry points, failing. */
          #include <stdint.h>
          #include <stddef.h>
          uint64_t nw_wifi_stats[512] __attribute__((aligned(16)));     /* zeroes, larger than struct nw_wifi_stats */
          volatile uint64_t nw_wifi_where[4];
          int nw_wifi_start(const void *p, const void *b) { (void)p; (void)b; return -19; }    /* -ENODEV */
          int nw_wifi_step(void) { return -19; }
          void nw_wifi_stop(void) { }
          int nw_wifi_scan(const uint8_t *ssid, size_t len) { (void)ssid; (void)len; return -19; }
          int nw_wifi_bss_count(void) { return 0; }
          int nw_wifi_bss_get(unsigned i, void *out) { (void)i; (void)out; return -19; }
          int nw_wifi_connect(const void *a, size_t b, const void *c, size_t d) { (void)a; (void)b; (void)c; (void)d; return -19; }
          int nw_wifi_disconnect(void) { return -19; }
          int nw_wifi_set_events(void *fn) { (void)fn; return -19; }
          int nw_wifi_status_get(void *out) { (void)out; return -19; }
          int nw_wifi_tx(const void *frame, size_t len) { (void)frame; (void)len; return -19; }
          ''')
          print('wrote bsd/dev/munch_nw_stubs.c')
          PY
          grep -n -c 'defined(__arm64e__)' dxb/xnu/osfmk/arm/arm_init.c dxb/xnu/osfmk/arm64/sleh.c dxb/xnu/osfmk/arm64/start.s

      - name: Select Xcode and install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install jq gum bash cmake ninja ccache
          # the pinned build script checks for xcodes, though Xcode is preinstalled
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # the Xcode of the macOS the sources are from (26.5), else the newest 26.x, else the newest
          XC=/Applications/Xcode_26.5.app
          [ -d "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          test -n "$XC"
          ls -d /Applications/Xcode_*.app
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          sw_vers
          xcodebuild -version

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the kernel
        shell: bash
        env:
          # MakeInc.def turns arm64 into arm64e when it has no EmbeddedDeviceMap entry for the board, and
          # honours this variable when it is set: the first runs compiled with __arm64e__ (kalloc.c
          # static_assert on T1SZ_BOOT + 1 + VM_KERNEL_POINTER_SIGNIFICANT_BITS). HakiOS's xnu-build.sh sets it too.
          ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG: arm64
          # XNU's own hook (makedefs/MakeInc.def: KCC = $(CCACHE) $(CC)); it leaves $(CC) alone so mig keeps working
          CCACHE: ccache
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 4G
          CCACHE_COMPILERCHECK: content
          CCACHE_NOHASHDIR: '1'
        run: |
          set -euo pipefail
          ccache --zero-stats
          cd dxb
          set +e
          bash build.sh 2>&1 | tee ../ios26-build.log
          rc=${PIPESTATUS[0]}
          set -e
          # The patch links -lpthread_kext. There is no kext loader, so HakiOS builds libpthread's kern/ sources as a
          # static library against the kernel's exported headers (xnu-deps/build/pthread/build.sh). That needs the
          # headers this build has just exported, so it runs after the first pass and the build is resumed.
          if [ "$rc" -ne 0 ] && grep -q "library 'pthread_kext' not found" ../ios26-build.log; then
            # this block's own output goes into the uploaded log too (run 9's failure here was only in the job log)
            exec > >(tee -a ../ios26-build.log) 2>&1
            echo "::group::libpthread_kext.a"
            LP=$(curl -fsS https://raw.githubusercontent.com/apple-oss-distributions/distribution-macOS/macos-265/release.json |
                 jq -r '.projects[] | select(.project=="libpthread") | .tag')
            echo "libpthread tag: $LP"
            git clone -q --depth 1 --branch "$LP" https://github.com/apple-oss-distributions/libpthread.git libpthread
            X=$PWD/xnu; E=$PWD/build/xnu.obj/EXPORT_HDRS; P=$PWD/libpthread
            test -d "$E/osfmk"
            mkdir -p pthread-kext/inc "$PWD/fakeroot/usr/local/lib/kernel"
            cat > pthread-kext/inc/TargetConditionals.h <<'EOF'
          #ifndef _TARGETCONDITIONALS_H_
          #define _TARGETCONDITIONALS_H_
          /* minimal stand-in for building the pthread kext sources outside Xcode */
          #define TARGET_OS_MAC 1
          #define TARGET_OS_OSX 0
          #define TARGET_OS_IPHONE 1
          #define TARGET_OS_IOS 1
          #define TARGET_OS_EMBEDDED 1
          #define TARGET_OS_SIMULATOR 0
          #define TARGET_OS_DRIVERKIT 0
          #define TARGET_CPU_ARM64 1
          #endif
          EOF
            for f in kern_init kern_support kern_synch; do
              xcrun -sdk iphoneos clang -arch arm64 -c -Os -mkernel -nostdinc -fno-builtin -fno-common -Wno-int-conversion \
                -DKERNEL=1 -DKERNEL_PRIVATE=1 -DPRIVATE=1 -D__PTHREAD_EXPOSE_INTERNALS__=1 \
                -Dpthread_kern=pthread_kext_kern -Dcurrent_uthread=pthread_kext_current_uthread \
                -D__DARWIN_64_BIT_INO_T=1 -DARM64_BOARD_CONFIG_BCM2837 \
                -Ipthread-kext/inc -I"$P" -I"$E/osfmk" -I"$E/bsd" -I"$E/libkern" -I"$E/pexpert" -I"$E/iokit" \
                -I"$E/security" -I"$X/EXTERNAL_HEADERS" -I"$P/include" -I"$P/private" \
                -o "pthread-kext/pthread_$f.o" "$P/kern/$f.c"
            done
            libtool -static -o fakeroot/usr/local/lib/kernel/libpthread_kext.a pthread-kext/pthread_*.o
            # build.sh's build_libdispatch makes libfirehose_kernel.a with xcodebuild -sdk macosx and
            # ARCHS="x86_64 arm64e" (run 7 log: Libtool ... normal arm64e): no plain arm64 slice, and arm64e code
            # (retab, braa) is undefined on SM8250. Rebuilt here the way HakiOS does (xnu-deps/setup.sh stage2):
            # iphoneos, plain arm64, against this kernel's exported headers. build_libdispatch skips when the
            # library exists, so the second pass keeps this one.
            # XNU_KERNEL_PRIVATE is left undefined, not 0 as HakiOS has it: 12377's kern/debug.h and kern/lock_rw.h test it
            # with #ifdef, and defined-as-0 pulled in upsi.h ("#error upsi.h is XNU private") and the lck_rw_new_t
            # internals (run 9). Undefined, debug.h includes <TargetConditionals.h>: the stub in pthread-kext/inc.
            mkdir -p firehose-kext
            D=$PWD/libdispatch
            test -f "$D/src/firehose/firehose_buffer.c"
            xcrun -sdk iphoneos clang -arch arm64 -c -Os -mkernel -nostdinc -fno-builtin \
              -DKERNEL=1 -DKERNEL_PRIVATE=1 -DPRIVATE=1 -D__DARWIN_64_BIT_INO_T=1 -Ipthread-kext/inc \
              -DDISPATCH_USE_DTRACE=0 -DOS_ATOMIC_CONFIG_MEMORY_ORDER_DEPENDENCY=1 \
              -DOS_ATOMIC_CONFIG_STARVATION_FREE_ONLY=0 -DOS_FIREHOSE_SPI=1 -DARM64_BOARD_CONFIG_BCM2837 \
              -I"$D" -I"$D/src" -I"$D/src/firehose" \
              -I"$E/osfmk" -I"$E/bsd" -I"$E/libkern" -I"$E/pexpert" -I"$E/iokit" -I"$E/security" \
              -I"$X/libkern/firehose" -I"$E/libkern/os" -I"$X/EXTERNAL_HEADERS" \
              -I"$PWD/fakeroot/usr/local/include/kernel" \
              -o firehose-kext/firehose_buffer.o "$D/src/firehose/firehose_buffer.c"
            libtool -static -o fakeroot/usr/local/lib/kernel/libfirehose_kernel.a firehose-kext/firehose_buffer.o
            for L in libpthread_kext libfirehose_kernel; do
              lipo -info "fakeroot/usr/local/lib/kernel/$L.a"
              test "$(lipo -archs "fakeroot/usr/local/lib/kernel/$L.a")" = arm64
            done
            ls -l fakeroot/usr/local/lib/kernel/
            echo "::endgroup::"
            bash build.sh
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          ccache --show-stats

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Validate and collect the kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          K=$(ls dxb/fakeroot/System/Library/Kernels/kernel.development.bcm2837 \
                 dxb/fakeroot/System/Library/Kernels/kernel.development.* 2>/dev/null | head -1)
          test -n "$K" || { echo "no kernel in dxb/fakeroot/System/Library/Kernels"; ls -l dxb/fakeroot/System/Library/Kernels || true; exit 1; }
          cp "$K" out/kernel.development.munch
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('out/kernel.development.munch')
          magic, cpu, subtype = struct.unpack_from('<III', p.read_bytes())
          assert magic == 0xfeedfacf, hex(magic)
          assert cpu == 0x0100000c, hex(cpu)
          assert (subtype & 0xffffff) in (0, 1), f'expected plain arm64, got subtype {subtype:#x}'
          print('Verified plain arm64 Mach-O:', p)
          PY
          # A plain arm64 header can still carry PAC code from a linked archive or a missed diagnostic. SM8250
          # (ARMv8.2) runs the hint-space forms (paciasp, autibsp, pacia1716, xpaclri) as NOPs; every other PAC
          # instruction is undefined there, so none may be in the kernel.
          # The hits go to out/pac-hits.txt with the function each is in, and the kernel is uploaded either way
          # (the artifact step below runs always): run 11 failed here and its kernel was lost with the runner.
          shasum -a 256 out/kernel.development.munch > out/SHA256SUMS
          otool -tvV out/kernel.development.munch > "$RUNNER_TEMP/kernel.dis"
          PAC='retaa|retab|eretaa|eretab|braaz?|brabz?|blraaz?|blrabz?|ldraa|ldrab|pacia|pacib|pacda|pacdb|paciza|pacizb|pacdza|pacdzb|pacga|autia|autib|autda|autdb|autiza|autizb|autdza|autdzb|xpaci|xpacd'
          awk -v re="(^|[^A-Za-z0-9_])($PAC)([^A-Za-z0-9_]|$)" '/^[^ \t].*:$/ { fn = $0; next } $0 ~ re { print fn "\t" $0 }' \
            "$RUNNER_TEMP/kernel.dis" > out/pac-hits.txt
          n=$(wc -l < out/pac-hits.txt | tr -d ' ')
          echo "non-hint PAC instructions: $n, in $(cut -f1 out/pac-hits.txt | sort -u | wc -l | tr -d ' ') functions"
          if [ "$n" -ne 0 ]; then cut -f1 out/pac-hits.txt | sort | uniq -c | sort -rn | head -60; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munch-xnu-12377-arm64
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: munch-xnu-12377-log
          path: ios26-build.log
          if-no-files-found: warn
          retention-days: 14
